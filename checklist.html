      { id:'p5', p:'medium', title:'Create "related topics" sections in your content', desc:'At the bottom of each article, add a "Related Topics" or "You might also like" section linking to semantically related content. This signals topical associations to AI.' },
      { id:'p6', p:'medium', title:'Build FAQ content covering adjacent user questions', desc:'Map the full universe of questions around each topic — not just the central question but the adjacent questions users ask before, during, and after their main query.' },
      { id:'p7', p:'medium', title:'Analyze competitors and fill content gaps', desc:'Use tools like Ahrefs, SEMrush, or free Google searches to identify what topics your competitors rank for that you don\'t. Those gaps are your "People Also Search For" opportunities.' },
      { id:'p8', p:'low', title:'Create entity relationship content', desc:'Write content about how your brand, product, or service relates to adjacent entities: tools you integrate with, people you work with, companies in your ecosystem.' },
    ]
  },
  {
    id: 'local',
    icon: '📍',
    title: 'Local AI SEO',
    desc: 'For businesses serving local markets, AI is transforming local search. These steps ensure you dominate local AI recommendations.',
    items: [
      { id:'loc1', p:'high', title:'Verify and fully optimize Google Business Profile', desc:'GBP is the #1 driver of local AI visibility. Complete every field: photos (min 20+), services, products, description (750 chars), hours, attributes, and Q&A.' },
      { id:'loc2', p:'high', title:'Add weekly posts to Google Business Profile', desc:'Regular GBP posts signal an active business. Post about offers, news, events, and tips. AI uses recency signals to determine if a business is still operating.' },
      { id:'loc3', p:'high', title:'Build 50+ consistent local citations', desc:'Citations on local directories (Yelp, Yellow Pages, local chambers, industry directories) with identical NAP data reinforce your entity to Google\'s local AI systems.' },
      { id:'loc4', p:'high', title:'Actively generate Google reviews (aim for 50+)', desc:'Review quantity and recency are major local AI signals. Create a simple review request system: email follow-up, QR codes, or automated SMS after service completion.' },
      { id:'loc5', p:'medium', title:'Create location-specific landing pages', desc:'For multi-location businesses, create a unique, non-duplicate page per location. Include local keywords, local testimonials, location schema, and embed a Google Map.' },
      { id:'loc6', p:'high', title:'Add LocalBusiness schema with full geo data', desc:'Include @type, name, address, telephone, openingHoursSpecification, geo (latitude/longitude), priceRange, and paymentAccepted. This feeds Google Maps AI directly.' },
      { id:'loc7', p:'medium', title:'Build local backlinks (local news, community sites)', desc:'Links from local news outlets, chambers of commerce, and community sites are powerful local authority signals. Sponsor local events, partner with local nonprofits.' },
      { id:'loc8', p:'medium', title:'List on Apple Maps, Bing Places, and Waze', desc:'Siri and other Apple AI products use Apple Maps. Bing Places feeds Microsoft Copilot local results. Waze is owned by Google but has a separate data pipeline.' },
    ]
  },
];

// ─────────────────────────────────────────────
//  RENDER & STATE
// ─────────────────────────────────────────────
let state = LS.get('ai-seo-checklist', {});
let currentSection = 'technical';
let currentFilter = 'all';

function totalItems() {
  return SECTIONS.reduce((n, s) => n + s.items.length, 0);
}
function doneItems() {
  return Object.values(state).filter(Boolean).length;
}

function updateProgress() {
  const done  = doneItems();
  const total = totalItems();
  const pct   = Math.round((done / total) * 100);
  document.getElementById('doneCount').textContent  = done;
  document.getElementById('totalCount').textContent = total;
  document.getElementById('pctLabel').textContent   = pct + '%';
  document.getElementById('progressBar').style.width = pct + '%';
}

function buildNav() {
  const nav = document.getElementById('sectionNav');
  SECTIONS.forEach(s => {
    const btn = document.createElement('button');
    btn.className = 'snav-btn' + (s.id === currentSection ? ' active' : '');
    btn.dataset.id = s.id;
    const done  = s.items.filter(i => state[i.id]).length;
    const total = s.items.length;
    btn.innerHTML = `${s.icon} ${s.title} <span class="snav-count">${done}/${total}</span>`;
    btn.onclick = () => switchSection(s.id);
    nav.appendChild(btn);
  });
}

function priorityBadge(p) {
  const map = { high: 'badge-red', medium: 'badge-amber', low: 'badge-green' };
  const labels = { high: '🔴 High', medium: '🟡 Medium', low: '🟢 Low' };
  return `<span class="badge ${map[p]}">${labels[p]}</span>`;
}

function renderSection(s) {
  const done  = s.items.filter(i => state[i.id]).length;
  const total = s.items.length;
  const pct   = Math.round((done/total)*100);

  const items = s.items.filter(i => {
    if (currentFilter === 'all') return true;
    if (currentFilter === 'undone') return !state[i.id];
    return i.p === currentFilter;
  });

  return `
    <div class="cat-section active" id="sec-${s.id}">
      <div class="cat-title">${s.icon} ${s.title}</div>
      <div class="cat-desc">${s.desc}</div>
      <div class="cat-progress">
        <div class="flex-between mb-1">
          <span class="text-sm text-muted">${done} of ${total} completed</span>
          <span class="text-sm bold" style="color:var(--primary-light)">${pct}%</span>
        </div>
        <div class="progress-wrap"><div class="progress-fill" style="width:${pct}%"></div></div>
      </div>
      ${items.length === 0
        ? '<div style="text-align:center;padding:3rem;color:var(--text-4);">No items match this filter in this section.</div>'
        : items.map(i => renderItem(i)).join('')
      }
    </div>`;
}

function renderItem(item) {
  const done = !!state[item.id];
  return `
    <div class="check-item ${done?'done':''}" id="item-${item.id}" onclick="toggleItem('${item.id}')">
      <div class="check-box">${done?'✓':''}</div>
      <div style="flex:1;min-width:0;">
        <div class="check-title">${item.title}</div>
        <div class="check-desc">${item.desc}</div>
        <div class="check-meta">${priorityBadge(item.p)}</div>
      </div>
    </div>`;
}

function toggleItem(id) {
  state[id] = !state[id];
  LS.set('ai-seo-checklist', state);
  const item = SECTIONS.flatMap(s => s.items).find(i => i.id === id);
  const el   = document.getElementById('item-'+id);
  if (el) {
    el.classList.toggle('done', state[id]);
    el.querySelector('.check-box').textContent = state[id] ? '✓' : '';
  }
  updateProgress();
  updateNavCounts();
}

function updateNavCounts() {
  SECTIONS.forEach(s => {
    const done  = s.items.filter(i => state[i.id]).length;
    const total = s.items.length;
    const btn   = document.querySelector(`.snav-btn[data-id="${s.id}"] .snav-count`);
    if (btn) btn.textContent = `${done}/${total}`;
  });
}

function switchSection(id) {
  currentSection = id;
  document.querySelectorAll('.snav-btn').forEach(b => b.classList.toggle('active', b.dataset.id === id));
  const s = SECTIONS.find(x => x.id === id);
  document.getElementById('checklistContainer').innerHTML = renderSection(s);
  window.scrollTo({ top: 200, behavior: 'smooth' });
}

function setFilter(f, btn) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b === btn));
  const s = SECTIONS.find(x => x.id === currentSection);
  document.getElementById('checklistContainer').innerHTML = renderSection(s);
}

function resetAll() {
  if (!confirm('Reset all progress? This cannot be undone.')) return;
  state = {};
  LS.set('ai-seo-checklist', state);
  updateProgress();
  updateNavCounts();
  switchSection(currentSection);
}

function exportProgress() {
  const done  = doneItems();
  const total = totalItems();
  let out = `AI SEO LAUNCHPAD — PROGRESS REPORT\n`;
  out += `Generated: ${new Date().toLocaleDateString()}\n`;
  out += `Progress: ${done}/${total} (${Math.round(done/total*100)}%)\n\n`;
  SECTIONS.forEach(s => {
    const completed = s.items.filter(i => state[i.id]).length;
    out += `\n== ${s.title} (${completed}/${s.items.length}) ==\n`;
    s.items.forEach(i => {
      out += `  [${state[i.id] ? 'X' : ' '}] ${i.title}\n`;
    });
  });
  downloadFile(out, 'ai-seo-checklist-progress.txt', 'text/plain');
}

// ── Init ───────────────────────────────────
buildNav();
updateProgress();
const firstSec = SECTIONS[0];
document.getElementById('checklistContainer').innerHTML = renderSection(firstSec);
</script>
</body>
</html>
